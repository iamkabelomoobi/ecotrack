spring.application.name=ecotrack

# Profile and Config
# Base configuration

# Connection pooling
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Hibernate (Safe for Production)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool (Optimized)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=200000

# Actuator (Secure)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_DETAILS:when_authorized}
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

# JWT (Environment Variable Fallback)
jwt.secret=${JWT_SECRET:your-very-secure-secret-key-at-least-32-characters}
jwt.expiration-time-ms=${JWT_EXPIRATION:86400000}

# Logging (Production-Safe)
logging.level.root=INFO
logging.level.org.springframework.web=${WEB_LOG_LEVEL:WARN}
logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:false}

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true